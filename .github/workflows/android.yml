# Compila la app Android del POS (Capacitor) y publica el APK en un enlace fijo:
# Release "pos-latest" → la tablet lo descarga siempre desde la misma URL.
name: Android POS

on:
  push:
    branches: [main]
    paths:
      - frontend/android/**
      - frontend/capacitor.config.ts
      - .github/workflows/android.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: APK de depuración
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # La app carga el sistema remoto (server.url), así que basta un dist mínimo.
      - name: Sincronizar Capacitor
        working-directory: frontend
        run: |
          mkdir -p dist
          [ -f dist/index.html ] || echo '<!doctype html>' > dist/index.html
          npx cap sync android
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Compilar APK
        working-directory: frontend/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Renombrar APK
        run: cp frontend/android/app/build/outputs/apk/debug/app-debug.apk panesypan-pos.apk
      - uses: actions/upload-artifact@v4
        with:
          name: panesypan-pos-apk
          path: panesypan-pos.apk
      - name: Mover la etiqueta pos-latest al commit actual
        run: |
          git tag -f pos-latest
          git push -f origin refs/tags/pos-latest
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: pos-latest
          name: POS Android (última)
          prerelease: true
          files: panesypan-pos.apk
          body: APK de depuración del POS compilado desde ${{ github.sha }}.
