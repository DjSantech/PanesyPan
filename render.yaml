# Blueprint de Render para la API de Panes & Panes.
# Documentación: https://render.com/docs/blueprint-spec
# Los valores marcados con "sync: false" se ingresan a mano en el panel de Render (son secretos).
services:
  - type: web
    name: panesypan-api
    runtime: node
    plan: free
    region: virginia
    branch: main
    autoDeploy: true
    # NODE_ENV=production haría que pnpm omita las devDependencies necesarias para compilar.
    # "npx pnpm" en vez de "npm install -g pnpm": la imagen de Render trae pnpm en una carpeta
    # de solo lectura, y una instalación global falla con EROFS al intentar reemplazarlo.
    # npx guarda su caché en una carpeta escribible, así que no choca con nada.
    buildCommand: >-
      NODE_ENV=development npx --yes pnpm@12.5.1 install --frozen-lockfile &&
      npx --yes pnpm@12.5.1 --filter @panesypan/backend build
    startCommand: node backend/dist/server.js
    healthCheckPath: /api/health
    buildFilter:
      paths:
        - backend/**
        - packages/shared/**
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - render.yaml
        - .node-version
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: panesypan
      # Panel POS + web pública (apex y www), separados por coma y sin barra final.
      - key: CORS_ORIGINS
        value: https://sistema.panesypan.com,https://panesypan.com,https://www.panesypan.com
      - key: TRUST_PROXY_HOPS
        value: '1'
      - key: ORIGIN_VERIFY_SECRET
        sync: false
      - key: RATE_LIMIT_WINDOW_MS
        value: '60000'
      - key: RATE_LIMIT_MAX
        value: '600'
      - key: AUTH_RATE_LIMIT_MAX
        value: '30'
      # Secretos de sesión: Render los genera (aleatorios y distintos entre sí).
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: CSRF_SECRET
        generateValue: true
      # Primer administrador: se ingresan a mano y SEED_ADMIN_PASSWORD se borra tras el primer ingreso.
      - key: SEED_ADMIN_NAME
        sync: false
      - key: SEED_ADMIN_USERNAME
        sync: false
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
      # Facturación electrónica con Factus: credenciales del panel de Factus (se ingresan a mano).
      # FACTUS_ENV: sandbox para la habilitación; production solo cuando la DIAN habilite el software.
      - key: FACTUS_ENV
        value: sandbox
      - key: FACTUS_CLIENT_ID
        sync: false
      - key: FACTUS_CLIENT_SECRET
        sync: false
      - key: FACTUS_USERNAME
        sync: false
      - key: FACTUS_PASSWORD
        sync: false
