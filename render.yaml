# Blueprint de Render para la API de PanesYPan.
# Documentación: https://render.com/docs/blueprint-spec
# Los valores marcados con "sync: false" se ingresan a mano en el panel de Render (son secretos).
services:
  - type: web
    name: panesypan-api
    runtime: node
    plan: free
    region: virginia
    branch: main
    autoDeploy: true
    # NODE_ENV=production haría que pnpm omita las devDependencies necesarias para compilar.
    buildCommand: >-
      npm install -g pnpm@12.5.1 &&
      NODE_ENV=development pnpm install --frozen-lockfile &&
      pnpm --filter @panesypan/backend build
    startCommand: node backend/dist/server.js
    healthCheckPath: /api/health
    buildFilter:
      paths:
        - backend/**
        - packages/shared/**
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - render.yaml
        - .node-version
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: panesypan
      - key: CORS_ORIGINS
        value: https://sistema.panesypan.com
      - key: TRUST_PROXY_HOPS
        value: '1'
      - key: ORIGIN_VERIFY_SECRET
        sync: false
      - key: RATE_LIMIT_WINDOW_MS
        value: '60000'
      - key: RATE_LIMIT_MAX
        value: '600'
